<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Exams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B4164; --navy-tint:#E4ECF5; --red:#E21D39; --red-dark:#B5142C;
  --bg:#F4F6F9; --card:#FFFFFF; --ink:#16212E; --muted:#526274; --line:#D6DFE9; --reading:#FFF4C2;
}
*{box-sizing:border-box}
html{font-size:21px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;line-height:1.6;letter-spacing:.02em;word-spacing:.12em}
.bar{background:var(--navy);color:#fff;border-bottom:4px solid var(--red)}
.bar .in{max-width:760px;margin:0 auto;padding:14px 16px;display:flex;gap:14px;align-items:center}
.bar img{width:56px;height:56px;background:#fff;border-radius:50%}
.bar .school{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.bar h1{margin:0;font-size:1.2rem;line-height:1.3}
main{max-width:760px;margin:0 auto;padding:8px 16px 80px}
.intro{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 6px}
.intro p{margin:0}
.card{background:var(--card);border:2px solid var(--line);border-left:8px solid var(--red);border-radius:14px;padding:16px 18px;margin:14px 0}
.card.reading{background:var(--reading)}
.card .yr{color:var(--red);font-weight:700;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.card h2{margin:2px 0 4px;font-size:1.05rem;color:var(--navy);line-height:1.35}
.card .meta{color:var(--muted);font-size:.8rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid transparent;border-radius:12px;padding:8px 16px;min-height:52px;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:none}
.btn:focus-visible{outline:3px solid #2A5682;outline-offset:2px}
.btn.listen{background:var(--navy-tint);color:var(--navy)}
.btn.go{background:var(--red);color:#fff}
.btn.go:hover{background:var(--red-dark)}
.btn.listen:hover{border-color:var(--navy)}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
<div class="bar"><div class="in">
  <img src="logo.png" alt="" onerror="this.style.display='none'">
  <div><div class="school">Rawabi English Academy · IT Department</div><h1>My Exams</h1></div>
</div></div>
<main>
  <div class="intro">
    <p id="introText">Press Listen to hear an exam's name. Press Start to begin.</p>
    <button class="btn listen" id="introListen">🔊 Listen</button>
  </div>
  <div id="list"></div>
</main>
<script>
/* The teacher's list of exams. Only exams with open: true are shown to students. */
const EXAMS = [
  { year: "10", title: "Revision Exam: Chapter 4 - Networks", marks: 30, time: "45 minutes", path: "y10-ch4/", open: true },
  { year: "10", title: "Revision Exam: Chapter 3 - Storage devices and media", marks: 29, time: "45 minutes", path: "y10-ch3/", open: false }
];

const synth = window.speechSynthesis;
function say(text, el){
  if (!synth) return;
  synth.cancel();
  document.querySelectorAll('.reading').forEach(e => e.classList.remove('reading'));
  const u = new SpeechSynthesisUtterance(text);
  const v = synth.getVoices().find(v => /^en-GB/i.test(v.lang)) || synth.getVoices().find(v => /^en/i.test(v.lang));
  if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';
  u.rate = 0.9;
  if (el){ u.onstart = () => el.classList.add('reading'); u.onend = () => el.classList.remove('reading'); }
  synth.speak(u);
}
const spoken = t => t.replace(/ - /g, ', ');

const open = EXAMS.filter(e => e.open);
const list = document.getElementById('list');
if (!open.length){
  list.innerHTML = '<div class="empty">No exam is open right now. Ask your teacher.</div>';
  document.getElementById('introText').textContent = 'No exam is open right now. Ask your teacher.';
}
open.forEach(e => {
  const c = document.createElement('section'); c.className = 'card';
  c.innerHTML = `<div class="yr">Year ${e.year}</div><h2></h2><div class="meta">${e.time} · ${e.marks} marks</div>
    <div class="row"><button class="btn listen">🔊 Listen</button><a class="btn go">▶ Start</a></div>`;
  c.querySelector('h2').textContent = e.title;
  c.querySelector('a.go').href = e.path;
  c.querySelector('button.listen').onclick = () => say(`Year ${e.year}. ${spoken(e.title)}. ${e.time}. ${e.marks} marks. Press Start to begin.`, c);
  list.appendChild(c);
});
document.getElementById('introListen').onclick = () => {
  const n = open.length;
  say(n ? `There ${n === 1 ? 'is 1 exam' : 'are ' + n + ' exams'} open. ` + open.map(e => spoken(e.title)).join('. ') + '. Press Start to begin.'
        : 'No exam is open right now. Ask your teacher.');
};
if (synth) synth.onvoiceschanged = () => {};
</script>
</body>
</html>
