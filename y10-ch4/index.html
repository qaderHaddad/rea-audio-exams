<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Rawabi English Academy: navy #1B4164 + red #E21D39 (from the logo) */
  --navy:#1B4164; --navy-2:#2A5682; --navy-tint:#E4ECF5; --red:#E21D39; --red-dark:#B5142C; --red-tint:#FCE6E9;
  --bg:#F4F6F9; --card:#FFFFFF; --ink:#16212E; --muted:#526274; --line:#D6DFE9;
  --accent:var(--red); --accent-ink:#FFFFFF; --hl:#FFE680; --reading:#FFF4C2;
  --mic:var(--red); --ok:#2E7D32; --btn:#EAEEF3; --btn-ink:var(--ink);
  --fs:21px;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Atkinson Hyperlegible","Verdana","Arial",sans-serif;line-height:1.7;letter-spacing:.02em;word-spacing:.12em}
button,input,select,textarea{font:inherit;letter-spacing:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 120px}

/* top bar */
.bar{position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;border-bottom:4px solid var(--red)}
.bar .btn{background:rgba(255,255,255,.14);color:#fff}
.bar .btn:hover{border-color:#fff}
.bar .ctl input[type=range]{accent-color:var(--red)}
.bar .timer{background:#fff;color:var(--navy);font-weight:700}
.bar .timer.running{background:#DFF0DF;color:#14532D}
.bar .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar .t{font-weight:700;flex:1 1 220px;font-size:.85rem;line-height:1.3}
.ctl{display:flex;align-items:center;gap:6px;font-size:.75rem}
.ctl input[type=range]{width:110px}
.ctl select{max-width:180px;font-size:.75rem;padding:4px}
.timer{font-variant-numeric:tabular-nums;font-size:.8rem;background:var(--btn);padding:4px 10px;border-radius:8px;min-width:84px;text-align:center}
.timerbox{display:inline-flex;gap:6px;align-items:center}
.sync{font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:8px;background:rgba(255,255,255,.14);color:#fff}
.sync.ok{background:#DFF0DF;color:#14532D}
.sync.bad{background:#FFE0B2;color:#7A3E00}
.sendnote{border-radius:12px;padding:12px 14px;margin:12px 0;font-weight:700}
.sendnote.ok{background:#DFF0DF;color:#14532D}
.sendnote.bad{background:#FFE0B2;color:#7A3E00}
.sendnote.wait{background:var(--navy-tint);color:var(--navy)}

header.top{display:flex;gap:16px;align-items:center;margin:24px 0 8px}
header.top img{width:64px;height:64px}
header.top h1{font-size:1.25rem;line-height:1.3;margin:0;color:var(--navy)}
header.top .dept{color:var(--red);font-weight:700;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
header.top .sub{color:var(--muted);font-size:.8rem}

.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px 20px;margin:18px 0}
.card.qcard{border-left:8px solid var(--accent)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.qhead h2{margin:0;font-size:1.1rem;color:var(--navy)}
.part{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.part:first-of-type{border-top:0}
.plabel{font-weight:700;margin-right:.4em}
.marks{color:var(--muted);font-size:.85rem;white-space:nowrap}
.say{border-radius:8px;padding:2px 4px;margin:0 -4px;transition:background .15s}
.say.reading{background:var(--reading)}
.w.on{background:var(--hl);border-radius:4px;box-shadow:0 0 0 2px var(--hl)}

.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid transparent;background:var(--btn);color:var(--btn-ink);
  border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:.85rem;min-height:48px}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--navy-2);outline-offset:2px}
.btn .ic{font-size:1.15rem;line-height:1}
.btn.listen{background:var(--navy-tint);color:var(--navy)}
.btn.mic{background:var(--red-tint);color:var(--red-dark)}
.btn.mic.live{background:var(--mic);color:#fff;animation:pulse 1.2s infinite}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-dark);border-color:transparent}
.btn.small{min-height:40px;padding:4px 10px;font-size:.75rem}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(226,29,57,.5)}50%{box-shadow:0 0 0 8px rgba(226,29,57,0)}}

.ans{margin-top:10px}
.ans .alabel{font-weight:700;margin-bottom:4px}
textarea{width:100%;border:2px solid #A9B8C8;border-radius:10px;padding:10px 12px;background:#FCFDFE;color:var(--ink);resize:vertical;line-height:1.6}
textarea:focus{outline:3px solid var(--navy-2);outline-offset:1px;border-color:var(--navy)}
textarea.reading{outline:3px solid #F2B705}
.interim{color:var(--muted);font-style:italic;min-height:1.2em;font-size:.85rem}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.opt{display:flex;align-items:stretch;border:2px solid #A9B8C8;border-radius:12px;background:#FCFDFE;overflow:hidden}
.opt button.pick{flex:1;border:0;background:transparent;color:var(--ink);text-align:left;padding:10px 12px;cursor:pointer;font-weight:700;min-height:52px}
.opt button.hear{border:0;border-left:2px solid var(--line);background:var(--navy-tint);width:50px;cursor:pointer;font-size:1.1rem}
.opt.sel{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}
.opt.sel button.pick::before{content:"✓ ";color:var(--ok)}
.pickinfo{font-size:.8rem;color:var(--muted);margin-top:6px}

.namebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.namebox input{flex:1 1 240px;border:2px solid #A9B8C8;border-radius:10px;padding:10px 12px;background:#FCFDFE;color:var(--ink);min-height:48px}
.namebox input:focus{outline:3px solid var(--navy-2);outline-offset:1px;border-color:var(--navy)}

.help ol{margin:6px 0 0;padding-left:1.3em}
.warn{background:#FFF0D6;border:2px solid #F2B705;border-radius:12px;padding:12px 14px;margin:12px 0;display:none}
.finish{display:flex;justify-content:center;margin:30px 0}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--card);border-radius:16px;padding:22px;max-width:520px;width:100%}
.modal .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* review / print */
#review{display:none}
.rv h1{font-size:1.2rem;margin:0}
.rv table{border-collapse:collapse;width:100%;margin:6px 0 14px;font-size:.85rem}
.rv td{border:1px solid #999;padding:4px 8px;vertical-align:top}
.rq{margin:14px 0;break-inside:avoid}
.rq .qt{font-weight:700}
.rq .a{white-space:pre-wrap;border:1px solid #999;border-radius:6px;padding:6px 10px;min-height:2em;margin:4px 0 8px;background:#fff}
.rq .a.empty{color:#999;font-style:italic}
.rq .mk{float:right;color:#333}
.mbox{display:inline-block;border:1px solid #333;min-width:48px;text-align:center;margin-left:6px}
body.reviewing #exam,body.reviewing .bar{display:none}
body.reviewing #review{display:block}
@media print{
  :root{--fs:12pt}
  body{background:#fff;letter-spacing:0;word-spacing:0;line-height:1.45}
  .noprint{display:none!important}
  .wrap{max-width:none;padding:0}
}
@media (max-width:560px){ .bar .t{flex-basis:100%} }
</style>
</head>
<body>

<div class="bar noprint">
  <div class="in">
    <div class="t" id="barTitle"></div>
    <label class="ctl">Speed <input type="range" id="rate" min="0.6" max="1.4" step="0.1" value="0.9"></label>
    <label class="ctl">Voice <select id="voice"></select></label>
    <span class="ctl"><button class="btn small" id="smaller" aria-label="Smaller text">A−</button><button class="btn small" id="bigger" aria-label="Bigger text">A+</button></span>
    <span class="timerbox"><span class="timer" id="timer" aria-live="off">⏱ 0:00</span><button class="btn small" id="timerToggle"><span class="ic">▶</span><span class="lbl">Start</span></button><button class="btn small" id="timerReset" aria-label="Reset timer"><span class="ic">↺</span>Reset</button></span>
    <span class="sync" id="sync" hidden></span>
    <button class="btn small" id="stopAll"><span class="ic">🔇</span>Stop sound</button>
  </div>
</div>

<script>
const EXAM = {"id": "y10-rev-ch4-2026-11-17", "slug": "y10-ch4", "title": "Revision Exam: Chapter 4 - Networks", "short": "Y10 Revision Exam: Chapter 4 (audio version)", "year": "10", "duration": "45 minutes", "total": 30, "date": "Tuesday, 17 November 2026", "folder": "Revision Exam - Chapter 4 - Networks", "questions": [{"n": 1, "intro": "A local area network (LAN) uses a hub.", "parts": [{"label": "a", "text": "Explain the purpose of a hub.", "marks": 3, "rows": 4}, {"label": "b", "text": "Describe one drawback of using a hub on a local area network (LAN).", "marks": 1, "rows": 2}]}, {"n": 2, "intro": "Remotely logging in to a college computer system requires two-factor authentication.", "parts": [{"label": "a", "text": "Explain what is meant by two-factor authentication.", "marks": 2, "rows": 3}, {"label": "b", "text": "State two examples of methods that could be used as part of two-factor authentication.", "marks": 2, "type": "list", "items": ["Example 1:", "Example 2:"], "rows": 2}]}, {"n": 3, "parts": [{"text": "Describe how data is stored and managed when using cloud computing.", "marks": 4, "rows": 6}]}, {"n": 4, "intro": "A company uses an intranet. They are considering using an extranet.", "parts": [{"text": "Compare an intranet with an extranet. Your answer must include similarities and differences.", "marks": 6, "rows": 9}]}, {"n": 5, "parts": [{"text": "Identify three different network communication devices and describe what each one does.", "marks": 6, "type": "list", "items": ["Device 1:", "What device 1 does:", "Device 2:", "What device 2 does:", "Device 3:", "What device 3 does:"], "rows": 2}]}, {"n": 6, "intro": "A computer contains both anti-virus software and anti-malware software.", "parts": [{"label": "a", "text": "Explain the differences between anti-virus software and anti-malware software.", "marks": 4, "rows": 6}, {"label": "b", "text": "Explain why both anti-virus software and anti-malware software are needed in the computer.", "marks": 2, "rows": 3}]}], "submitUrl": "https://script.google.com/macros/s/AKfycbyMJ_2gKQmIDvy9KWrKNDUWUa12XDZdYI444jdX6IUylLcMSrNU7L4e2BEjZ5cKdIP6/exec"};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const KEY = 'audio-exam:' + EXAM.id;
const newSid = () => Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
let state = store.get(KEY) || { answers:{}, picks:{}, name:'', elapsed:0, runStart:null, finished:null };
if (!state.sid){ state.sid = newSid(); store.set(KEY, state); }
if (state.started !== undefined){ delete state.started; }
const save = () => { store.set(KEY, state); queueSync(); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const marksWord = m => m === 1 ? '1 mark' : m + ' marks';

/* readable text: wraps each word in a span so we can highlight while reading */
function readable(tag, text, cls){
  const el = document.createElement(tag);
  el.className = 'say' + (cls ? ' ' + cls : '');
  const words = [];
  let pos = 0;
  text.split(/(\s+)/).forEach(tok => {
    if (!tok) return;
    if (/^\s+$/.test(tok)) { el.appendChild(document.createTextNode(tok)); pos += tok.length; return; }
    const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = tok;
    el.appendChild(sp); words.push({ s:pos, e:pos+tok.length, el:sp }); pos += tok.length;
  });
  el._seg = { el, text, words };
  return el;
}
const segOf = el => el._seg || { el, text: el.textContent, words: [] };
const plainSeg = (text) => ({ el:null, text, words:[] });

/* ---------- text to speech ---------- */
const synth = window.speechSynthesis;
let voices = [], speakToken = 0;
function loadVoices(){
  if (!synth) return;
  voices = synth.getVoices().filter(v => /^en/i.test(v.lang));
  const sel = $('#voice'); const keep = store.get(KEY+':voice');
  sel.innerHTML = '';
  // prefer natural-sounding local voices
  const rank = v => (/(UK|GB)/i.test(v.name+v.lang)?0:1) + (v.localService?0:2) + (/Google|Natural|Premium|Enhanced|Daniel|Serena|Samantha|Karen|Moira/i.test(v.name)?0:1);
  voices.sort((a,b)=>rank(a)-rank(b));
  voices.forEach((v,i) => { const o=document.createElement('option'); o.value=v.name; o.textContent=v.name.replace(/Microsoft |Google /,''); sel.appendChild(o); });
  if (keep && voices.some(v=>v.name===keep)) sel.value = keep;
}
if (synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }
$('#voice').onchange = e => store.set(KEY+':voice', e.target.value);

function clearHL(){
  document.querySelectorAll('.reading').forEach(e=>e.classList.remove('reading'));
  document.querySelectorAll('.w.on').forEach(e=>e.classList.remove('on'));
}
function stopSpeaking(){ speakToken++; if (synth) synth.cancel(); clearHL(); }

/* speak a list of segments one after another */
function speak(segs, onDone){
  if (!synth){ return; }
  stopListening();
  stopSpeaking();
  const token = speakToken;
  const rate = parseFloat($('#rate').value);
  const voice = voices.find(v => v.name === $('#voice').value);
  let i = 0;
  const next = () => {
    if (token !== speakToken) return;
    clearHL();
    if (i >= segs.length){ onDone && onDone(); return; }
    const seg = segs[i++];
    if (!seg.text.trim()){ next(); return; }
    // long numbers (barcodes, product codes) are read digit by digit
    const sayText = seg.text.replace(/\d{5,}/g, m => m.split('').join(' '));
    const sameText = sayText === seg.text;
    const u = new SpeechSynthesisUtterance(sayText);
    u.rate = rate; if (voice){ u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-GB';
    u.onstart = () => { if (seg.el){ seg.el.classList.add('reading'); seg.el.scrollIntoView({block:'nearest',behavior:'smooth'}); } };
    u.onboundary = e => {
      if (!sameText) return;
      if (e.name && e.name !== 'word') return;
      seg.words.forEach(w => w.el.classList.toggle('on', e.charIndex >= w.s && e.charIndex < w.e));
    };
    u.onend = () => setTimeout(next, 250);
    u.onerror = () => setTimeout(next, 50);
    synth.speak(u);
  };
  next();
}
$('#stopAll').onclick = () => { stopSpeaking(); stopListening(); };

/* ---------- speech to text ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recField = null, recBtn = null, recWanted = false;
const undoStack = {};   // undo stack per field

if (!SR){
  const w = $('#noMic'); w.style.display='block';
  w.innerHTML = '<b>Talking to type is not built into this browser.</b> Please open this file in <b>Google Chrome</b> or <b>Microsoft Edge</b>. On a Mac you can also click in an answer box and press the <b>🌐 / Fn key twice</b> to use Mac dictation.';
}

function getField(id){ return document.getElementById(id); }
function setValue(id, val){
  const f = getField(id); f.value = val;
  if (id === 'studentName') state.name = val; else state.answers[id] = val;
  save();
}

function startListening(id, btn){
  if (!SR) return;
  stopSpeaking();
  if (rec) stopListening();
  recField = id; recBtn = btn; recWanted = true;
  undoStack[id] = undoStack[id] || [];
  undoStack[id].push(getField(id).value);
  rec = new SR();
  rec.lang = 'en-GB'; rec.continuous = true; rec.interimResults = true;
  const interimEl = document.getElementById('int-' + id);
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if (r.isFinal){
        let t = r[0].transcript.trim();
        if (!t) continue;
        t = spokenPunctuation(t);
        const cur = getField(id).value;
        const needCap = !cur.trim() || /[.!?]\s*$/.test(cur);
        if (needCap) t = t.charAt(0).toUpperCase() + t.slice(1);
        const sep = cur && !/\s$/.test(cur) && !/^[.,!?]/.test(t) ? ' ' : '';
        setValue(id, cur + sep + t);
      } else interim += r[0].transcript;
    }
    if (interimEl) interimEl.textContent = interim ? '… ' + interim : '';
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      recWanted = false;
      showModal('The microphone is blocked. Ask your teacher to allow the microphone for this page, then try again.', [['OK', hideModal]]);
    } else if (e.error === 'network'){
      recWanted = false;
      showModal('Talking to type needs the internet in this browser. Ask your teacher to check the Wi-Fi.', [['OK', hideModal]]);
    }
  };
  rec.onend = () => {
    if (interimEl) interimEl.textContent = '';
    if (recWanted && recField === id){ try{ rec.start(); }catch(e){} return; }   // keep listening through pauses
    btnIdle(btn);
  };
  try{ rec.start(); btnLive(btn); }catch(e){}
}
function stopListening(){
  recWanted = false;
  if (rec){ try{ rec.stop(); }catch(e){} }
  if (recBtn) btnIdle(recBtn);
  rec = null; recField = null; recBtn = null;
}
function btnLive(b){ b.classList.add('live'); b.querySelector('.lbl').textContent = 'Stop talking'; b.querySelector('.ic').textContent='⏺'; }
function btnIdle(b){ b.classList.remove('live'); b.querySelector('.lbl').textContent = b.dataset.idle || 'Say it'; b.querySelector('.ic').textContent='🎤'; }

/* simple spoken punctuation */
function spokenPunctuation(t){
  return t.replace(/\s*\b(full stop|period)\b/gi, '.')
          .replace(/\s*\bcomma\b/gi, ',')
          .replace(/\s*\bquestion mark\b/gi, '?')
          .replace(/\s*\bnew line\b\s*/gi, '\n');
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-mic]');
  if (!b) return;
  const id = b.dataset.mic;
  if (recField === id) stopListening(); else startListening(id, b);
});

/* ---------- build the exam ---------- */
$('#barTitle').textContent = EXAM.short;
$('#title').textContent = EXAM.title;
$('#sub').textContent = `Year ${EXAM.year} · ${EXAM.duration} · ${EXAM.total} marks · ${EXAM.date}`;
document.title = EXAM.short;

const howSteps = [
  'Press a blue Listen button to hear a question. You can listen as many times as you want.',
  'Press a red Say it button, then say your answer. Your words will appear in the box.',
  'Press Stop talking when you have finished. Then press Play my answer to check it.',
  'If a word is wrong, press Undo, then say it again. You can also say comma or full stop.',
  'When you have answered every question, press I have finished at the bottom.'
];
const howSegs = [segOf($('#howTitle'))];
howSteps.forEach(s => { const li = readable('li', s); $('#howList').appendChild(li); howSegs.push(segOf(li)); });
$('#howListen').onclick = () => speak(howSegs);

function answerBlock(id, label, rows, sayLabel){
  const wrap = document.createElement('div'); wrap.className = 'ans';
  let labelEl = null;
  if (label){ labelEl = readable('div', label, 'alabel'); wrap.appendChild(labelEl); }
  const ta = document.createElement('textarea'); ta.id = id; ta.rows = rows;
  ta.setAttribute('aria-label', sayLabel || label || 'Answer');
  ta.value = state.answers[id] || '';
  ta.oninput = () => { state.answers[id] = ta.value; save(); };
  wrap.appendChild(ta);
  const int = document.createElement('div'); int.className='interim'; int.id='int-'+id; wrap.appendChild(int);
  const tools = document.createElement('div'); tools.className = 'tools';
  tools.innerHTML = `<button class="btn mic" data-mic="${id}" data-idle="Say it"><span class="ic">🎤</span><span class="lbl">Say it</span></button>
    <button class="btn listen" data-play="${id}"><span class="ic">▶️</span>Play my answer</button>
    <button class="btn" data-undo="${id}"><span class="ic">↩️</span>Undo</button>`;
  wrap.appendChild(tools);
  return { wrap, labelEl };
}

document.addEventListener('click', e => {
  const p = e.target.closest('[data-play]');
  if (p){
    const ta = getField(p.dataset.play);
    const v = ta.value.trim();
    speak([{ el:ta, text: v || 'This answer is empty.', words:[] }]);
  }
  const u = e.target.closest('[data-undo]');
  if (u){
    const id = u.dataset.undo; const h = undoStack[id];
    if (recField === id) stopListening();
    if (h && h.length){ setValue(id, h.pop()); speak([plainSeg('Undone.')]); }
    else { setValue(id, ''); speak([plainSeg('The box is now empty.')]); }
  }
});

const Q = $('#questions');
const ALL_SEGS = [];
EXAM.questions.forEach((q, qi) => {
  const card = document.createElement('section'); card.className = 'card qcard';
  const head = document.createElement('div'); head.className = 'qhead';
  const h2 = readable('h2', `Question ${q.n}`);
  const qTotal = q.parts.reduce((a,p)=>a+p.marks,0);
  const lb = document.createElement('button'); lb.className = 'btn listen'; lb.innerHTML = '<span class="ic">🔊</span>Listen to the whole question';
  head.append(h2, lb);
  card.appendChild(head);
  const qSegs = [segOf(h2)];
  let introEl = null;
  if (q.intro){ introEl = readable('p', q.intro); card.appendChild(introEl); qSegs.push(segOf(introEl)); }

  let curSub = null;   // lead-in shared by sub-parts, e.g. (b)(i), (b)(ii)
  q.parts.forEach((p, pi) => {
    const part = document.createElement('div'); part.className = 'part';
    const pSegs = [];
    if (introEl && q.parts.length > 1) pSegs.push(segOf(introEl));
    if (p.subintro){ const si = readable('p', p.subintro); part.appendChild(si); pSegs.push(segOf(si)); qSegs.push(segOf(si)); curSub = { letter:(p.label||'')[0], seg:segOf(si) }; }
    else if (curSub && p.label && p.label[0] === curSub.letter) pSegs.push(curSub.seg);
    else curSub = null;
    const line = document.createElement('div'); line.className = 'qhead';
    const txt = readable('div', (p.label ? (p.disp || `(${p.label})`) + ' ' : '') + p.text);
    const mk = document.createElement('span'); mk.className='marks'; mk.textContent = `[${p.marks}]`;
    const pl = document.createElement('button'); pl.className='btn listen small'; pl.innerHTML='<span class="ic">🔊</span>Listen';
    const left = document.createElement('div'); left.style.flex='1 1 300px'; left.appendChild(txt);
    line.append(left, mk, pl);
    part.appendChild(line);
    const txtSeg = segOf(txt);
    const markSeg = plainSeg(`This part is worth ${marksWord(p.marks)}.`);
    pSegs.push(txtSeg, markSeg); qSegs.push(txtSeg, markSeg);

    if (p.type === 'choice'){
      const id = `q${q.n}${p.label||''}`;
      const picks = new Set(state.picks[id] || []);
      const grid = document.createElement('div'); grid.className = 'opts';
      const info = readable('div', `Choose ${p.pick}. Press an answer to choose it. Press it again to un-choose it.`, 'pickinfo');
      const optSegs = [];
      p.options.forEach((o, oi) => {
        const box = document.createElement('div'); box.className = 'opt' + (picks.has(o) ? ' sel':'');
        const pick = document.createElement('button'); pick.className='pick'; pick.textContent = o;
        const hear = document.createElement('button'); hear.className='hear'; hear.textContent='🔊'; hear.setAttribute('aria-label','Listen to '+o);
        box._seg = { el:box, text:o, words:[] };
        optSegs.push(box._seg);
        hear.onclick = () => speak([box._seg]);
        pick.onclick = () => {
          if (picks.has(o)){ picks.delete(o); box.classList.remove('sel'); speak([plainSeg(`${o}. Not chosen.`)]); }
          else {
            if (picks.size >= p.pick){ speak([plainSeg(`You have already chosen ${p.pick}. Press one of them again to un-choose it first.`)]); return; }
            picks.add(o); box.classList.add('sel'); speak([plainSeg(`${o}. Chosen. You have chosen ${picks.size} of ${p.pick}.`)]);
          }
          state.picks[id] = [...picks]; save();
        };
        box.append(pick, hear); grid.appendChild(box);
      });
      part.append(info, grid);
      const choicesSeg = plainSeg('The choices are: ' + p.options.join('. ') + '.');
      pSegs.push(segOf(info), choicesSeg);
      qSegs.push(segOf(info), choicesSeg);
    } else if (p.type === 'list'){
      p.items.forEach((it, ii) => {
        const id = `q${q.n}${p.label||''}-${ii+1}`;
        const { wrap } = answerBlock(id, it, p.rows || 2, `${p.text} answer ${it}`);
        part.appendChild(wrap);
      });
    } else {
      const id = `q${q.n}${p.label||''}`;
      const { wrap } = answerBlock(id, 'Your answer', p.rows || 2);
      part.appendChild(wrap);
    }
    pl.onclick = () => speak(pSegs);
    card.appendChild(part);
  });
  lb.onclick = () => speak(qSegs);
  Q.appendChild(card);
});

/* ---------- name ---------- */
const nameEl = $('#studentName');
nameEl.value = state.name || '';
nameEl.oninput = () => { state.name = nameEl.value; save(); };

/* ---------- controls ---------- */
let fs = store.get(KEY+':fs') || 21;
const applyFs = () => { document.documentElement.style.setProperty('--fs', fs+'px'); store.set(KEY+':fs', fs); };
applyFs();
$('#bigger').onclick = () => { fs = Math.min(30, fs+2); applyFs(); };
$('#smaller').onclick = () => { fs = Math.max(15, fs-2); applyFs(); };
const rateKeep = store.get(KEY+':rate'); if (rateKeep) $('#rate').value = rateKeep;
$('#rate').onchange = e => store.set(KEY+':rate', e.target.value);

const fmt = ms => { const s = Math.floor(ms/1000); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); };
const elapsedNow = () => state.elapsed + (state.runStart ? Date.now() - state.runStart : 0);
function drawTimer(){
  $('#timer').textContent = '⏱ ' + fmt(elapsedNow());
  $('#timer').classList.toggle('running', !!state.runStart);
  const b = $('#timerToggle');
  b.querySelector('.ic').textContent = state.runStart ? '⏸' : '▶';
  b.querySelector('.lbl').textContent = state.runStart ? 'Pause' : (state.elapsed ? 'Resume' : 'Start');
}
function startTimer(){ if (!state.runStart){ state.runStart = Date.now(); save(); } drawTimer(); }
function pauseTimer(){ if (state.runStart){ state.elapsed = elapsedNow(); state.runStart = null; save(); } drawTimer(); }
$('#timerToggle').onclick = () => state.runStart ? pauseTimer() : startTimer();
$('#timerReset').onclick = () => showModal('Reset the timer to zero?', [
  ['Cancel', hideModal],
  ['Reset', () => { state.elapsed = 0; state.runStart = null; save(); drawTimer(); hideModal(); }, 'primary']]);
setInterval(drawTimer, 1000); drawTimer();

/* ---------- modal ---------- */
function showModal(text, buttons){
  $('#modalText').textContent = text;
  const row = $('#modalRow'); row.innerHTML = '';
  buttons.forEach(([lbl, fn, cls]) => { const b = document.createElement('button'); b.className='btn '+(cls||''); b.textContent=lbl; b.onclick=fn; row.appendChild(b); });
  $('#modal').style.display = 'flex';
  speak([plainSeg(text)]);
}
function hideModal(){ $('#modal').style.display = 'none'; stopSpeaking(); }


/* ---------- online saving (Google Sheet) ---------- */
let syncTimer = null, syncBusy = false, syncAgain = false, lastSent = '';
function queueSync(delay){
  if (!EXAM.submitUrl) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncNow(), delay ?? 4000);
}
function syncChip(cls, text){
  const s = document.getElementById('sync'); if (!s) return;
  s.hidden = false; s.className = 'sync ' + cls; s.textContent = text;
}
function answerRows(){
  const rows = [];
  EXAM.questions.forEach(q => q.parts.forEach(p => {
    const base = `q${q.n}${p.label||''}`;
    const ref = `${q.n}${p.label ? (p.disp || '('+p.label+')') : ''}`;
    if (p.type === 'choice') rows.push({ ref, marks:p.marks, answer:(state.picks[base]||[]).join(', ') });
    else if (p.type === 'list') p.items.forEach((it,ii) => rows.push({ ref: ref + ' ' + it.replace(/:$/,''), marks: ii===0 ? p.marks : '', answer:(state.answers[`${base}-${ii+1}`]||'').trim() }));
    else rows.push({ ref, marks:p.marks, answer:(state.answers[base]||'').trim() });
  }));
  return rows;
}
async function syncNow(){
  if (!EXAM.submitUrl) return false;
  if (syncBusy){ syncAgain = true; return false; }
  const payload = {
    exam: EXAM.id, title: EXAM.title, year: EXAM.year, sid: state.sid,
    name: state.name || '', status: state.finished ? 'Finished' : 'In progress',
    timeUsed: fmt(elapsedNow()), answers: answerRows()
  };
  const body = JSON.stringify(payload);
  if (body === lastSent){ syncChip('ok', '✓ Saved'); return true; }
  syncBusy = true; syncChip('', 'Saving…');
  let ok = false;
  try{
    const r = await fetch(EXAM.submitUrl, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body });
    const j = await r.json().catch(() => ({}));
    ok = r.ok && j.ok !== false;
  }catch(e){ ok = false; }
  syncBusy = false;
  if (ok){ lastSent = body; syncChip('ok', '✓ Saved'); }
  else { syncChip('bad', '⚠ Not saved — retrying'); queueSync(15000); }
  if (syncAgain){ syncAgain = false; queueSync(500); }
  return ok;
}
window.addEventListener('online', () => queueSync(500));
if (EXAM.submitUrl) queueSync(1000);

/* ---------- finish + review ---------- */
function allFields(){
  const out = [];
  EXAM.questions.forEach(q => q.parts.forEach(p => {
    if (p.type === 'choice') out.push({ id:`q${q.n}${p.label||''}`, choice:true });
    else if (p.type === 'list') p.items.forEach((_,ii)=>out.push({ id:`q${q.n}${p.label||''}-${ii+1}` }));
    else out.push({ id:`q${q.n}${p.label||''}` });
  }));
  return out;
}
$('#finishBtn').onclick = () => {
  stopListening();
  const empty = allFields().filter(f => f.choice ? !(state.picks[f.id]||[]).length : !(state.answers[f.id]||'').trim()).length;
  const msg = empty ? `You have ${empty} empty answer box${empty>1?'es':''}. Do you want to go back and check, or finish now?` : 'Are you sure you have finished?';
  showModal(msg, [['Go back', hideModal], ['Yes, I have finished', () => { hideModal(); finish(); }, 'primary']]);
};

function finish(){
  pauseTimer();
  if (!state.finished){ state.finished = Date.now(); save(); }
  const r = $('#review');
  const used = fmt(elapsedNow());
  let h = `<header class="top rv"><img src="${document.querySelector('header.top img').src}" alt="" style="width:54px;height:54px">
    <div><h1>${esc(EXAM.title)}</h1><div class="sub">Rawabi English Academy · IT Department · Year ${EXAM.year}</div></div></header>
    <div class="rv"><table>
      <tr><td><b>Student</b></td><td>${esc(state.name||'')}</td><td><b>Date</b></td><td>${esc(EXAM.date)}</td></tr>
      <tr><td><b>Time used</b></td><td>${used}</td><td><b>Total</b></td><td>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; / ${EXAM.total}</td></tr>
      <tr><td colspan="4">Taken with a computer reader (text-to-speech) and voice recognition. Answers below were dictated by the student; spelling is the software's.</td></tr>
    </table>
    ${EXAM.submitUrl ? '<div class="sendnote wait noprint" id="sendNote">Sending your answers to your teacher…</div>' : ''}`;
  EXAM.questions.forEach(q => {
    h += `<div class="rq"><div class="qt">Question ${q.n}</div>`;
    if (q.intro) h += `<div>${esc(q.intro)}</div>`;
    q.parts.forEach(p => {
      h += `<div style="margin-top:6px">`;
      if (p.subintro) h += `<div>${esc(p.subintro)}</div>`;
      h += `<span class="mk">[${p.marks}] <span class="mbox">&nbsp;</span></span>${p.label?'<b>'+esc(p.disp||'('+p.label+')')+'</b> ':''}${esc(p.text)}`;
      const id = `q${q.n}${p.label||''}`;
      if (p.type === 'choice'){
        const v = (state.picks[id]||[]);
        h += `<div class="a ${v.length?'':'empty'}">${v.length ? 'Chose: ' + v.map(esc).join(', ') : 'No answer'}</div>`;
      } else if (p.type === 'list'){
        p.items.forEach((it,ii) => { const v=(state.answers[`${id}-${ii+1}`]||'').trim(); h += `<div class="a ${v?'':'empty'}"><b>${esc(it)}</b> ${v?esc(v):'No answer'}</div>`; });
      } else {
        const v=(state.answers[id]||'').trim(); h += `<div class="a ${v?'':'empty'}">${v?esc(v):'No answer'}</div>`;
      }
      h += `</div>`;
    });
    h += `</div>`;
  });
  h += `</div><div class="finish noprint" style="gap:10px;flex-wrap:wrap">
    <button class="btn primary" onclick="window.print()"><span class="ic">🖨️</span>Print / Save as PDF</button>
    <button class="btn" onclick="document.body.classList.remove('reviewing');window.scrollTo(0,0)"><span class="ic">↩️</span>Back to the exam</button>
    <button class="btn" id="resetBtn"><span class="ic">🗑️</span>Clear all answers (teacher)</button></div>`;
  r.innerHTML = h;
  document.body.classList.add('reviewing'); window.scrollTo(0,0);
  speak([plainSeg('Well done. You have finished. Please tell your teacher.')]);
  if (EXAM.submitUrl) (async () => {
    clearTimeout(syncTimer); lastSent = '';
    let ok = await syncNow();
    for (let i = 0; !ok && i < 2; i++){ await new Promise(r => setTimeout(r, 3000)); ok = await syncNow(); }
    const n = document.getElementById('sendNote'); if (!n) return;
    n.className = 'sendnote noprint ' + (ok ? 'ok' : 'bad');
    n.innerHTML = ok ? '✓ Your answers have been sent to your teacher.'
      : '⚠ Your answers were not sent. Tell your teacher. <button class="btn small" id="retrySend">Try again</button>';
    const rb = document.getElementById('retrySend');
    if (rb) rb.onclick = () => { lastSent=''; syncNow().then(ok2 => { if (ok2){ n.className='sendnote noprint ok'; n.textContent='✓ Your answers have been sent to your teacher.'; } }); };
  })();
  $('#resetBtn').onclick = () => showModal('Teacher: this clears every answer on this device so a new student can start.' + (EXAM.submitUrl ? ' Answers already sent to your Google Sheet are kept.' : ' Make sure you have saved the PDF first.'), [
    ['Cancel', hideModal], ['Delete answers', () => { clearTimeout(syncTimer); try{ localStorage.removeItem(KEY); }catch(e){} location.reload(); }, 'primary']]);
}
if (state.finished) { /* reopened after finishing: stay on the exam so the teacher can review */ }
</script>
</body>
</html>
